<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Horus Fayoum Rider - نقل الفيوم الذكي للراكب">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="horus_rider">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>حورس | تطبيق الراكب</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;height:100%;background:#0B1F3A}
    #horus-loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:radial-gradient(600px 300px at 50% 0%,#123B70,#0B1F3A);color:#fff;font-family:"Segoe UI",Tahoma,Arial,sans-serif;z-index:10}
    #horus-loading .t{font-size:2rem;font-weight:900;color:#FFC107}
    #horus-loading .s{color:#c9d8f2}
    .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,193,7,.25);border-top-color:#FFC107;animation:sp 1s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="horus-loading" dir="rtl"><div class="t">حورس</div><div class="spin"></div><div class="s">جاري تحميل تطبيق الراكب…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function(){var e=document.getElementById('horus-loading');if(e)e.remove();});
    setTimeout(function(){var e=document.getElementById('horus-loading');if(e)e.querySelector('.s').textContent='التحميل يأخذ وقتاً على الإنترنت البطيء…';},12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
