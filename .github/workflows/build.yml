name: 𓂀 Horus Fayoum - Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-rider:
    name: 📱 Rider APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: horus-rider-apk
          path: rider/build/app/outputs/flutter-apk/app-release.apk

  build-driver:
    name: 🧑‍✈️ Driver APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: horus-driver-apk
          path: driver/build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: 🌐 Web (rider+driver+admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get --directory=rider && flutter build web --no-pub --output=web-out/rider --directory=rider || (cd rider && flutter pub get && flutter build web --release --web-renderer canvaskit -o ../web-out/rider)
      - run: cd driver && flutter pub get && flutter build web --release -o ../web-out/driver
      - run: cd admin && flutter pub get && flutter build web --release -o ../web-out/admin
      - uses: actions/upload-artifact@v4
        with:
          name: horus-web
          path: web-out/
