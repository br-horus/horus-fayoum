name: 𓂀 Horus Fayoum - Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-rider:
    name: 📱 Rider APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Regenerate android platform (match CI Flutter)
        working-directory: rider
        run: flutter create --platforms android --org com.horus.fayoum --project-name horus_rider .
      - name: Set Arabic app label
        working-directory: rider
        run: sed -i 's/android:label="horus_rider"/android:label="حورس | نقل الفيوم"/' android/app/src/main/AndroidManifest.xml
      - name: Setup release signing
        working-directory: rider
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/horus-upload.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=horus-upload.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      - name: Build universal APK (all ABIs, release-signed)
        working-directory: rider
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: horus-rider-apk
          path: rider/build/app/outputs/flutter-apk/app-release.apk

  build-driver:
    name: 🧑‍✈️ Driver APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Regenerate android platform (match CI Flutter)
        working-directory: driver
        run: flutter create --platforms android --org com.horus.fayoum --project-name horus_driver .
      - name: Set Arabic app label
        working-directory: driver
        run: sed -i 's/android:label="horus_driver"/android:label="حورس كابتن | الفيوم"/' android/app/src/main/AndroidManifest.xml
      - name: Setup release signing
        working-directory: driver
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/horus-upload.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=horus-upload.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      - name: Build universal APK (all ABIs, release-signed)
        working-directory: driver
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: horus-driver-apk
          path: driver/build/app/outputs/flutter-apk/app-release.apk
