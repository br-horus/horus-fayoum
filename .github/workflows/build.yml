name: 𓂀 Horus Fayoum - Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-rider:
    name: 📱 Rider APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: horus-rider-apk
          path: rider/build/app/outputs/flutter-apk/app-release.apk

  build-driver:
    name: 🧑‍✈️ Driver APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: horus-driver-apk
          path: driver/build/app/outputs/flutter-apk/app-release.apk
